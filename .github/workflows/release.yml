name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  packages: write

jobs:
  build-libchdr:
    uses: ./.github/workflows/libchdr.yml
  release:
    runs-on: ubuntu-latest
    needs:
      - build-libchdr
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "^1.26"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get compiled libchdr
        uses: actions/download-artifact@v8
        with:
          pattern: libchdr-*
          path: thirdparty/libchdr
      
      - name: Extract compiled libchdr
        run: |
          find thirdparty/libchdr -type f -name '*.tar' -execdir sh -c 'tar -xf "{}" && rm "{}"' \;
          ls -R thirdparty/libchdr

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
